# Model settings. Not business rules (those are in rules.yaml). [assumption]
# Standard, conservative LightGBM settings; not tuned on the test set.

payment_model:
  lightgbm:
    objective: cross_entropy # accepts soft targets in [0, 1]
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    num_boost_round: 500
    early_stopping_rounds: 50 # on validation weak labels
  # Frozen on validation: the cut-off that maximises F1 against validation targets.
  threshold_metric: f1

shop_model:
  # 1) Expected daily turnover from what the shop IS (not what it does).
  turnover:
    inputs: [category, area_type, size_tier]
    loss: absolute_error # median-type loss: a few huge misuse shops cannot pull "expected" up
    max_iter: 200
    learning_rate: 0.1
  # 2) Odd behaviour among similar shops.
  isolation_forest:
    peer_group: [category, area_type]
    min_peer_shops: 30 # smaller groups fall back to the category alone
    features:
      - round_1000_share_30d
      - after_hours_share_30d
      - first_visit_share_30d
      - far_payer_share_30d
      - unique_payers_per_day_7d
      - turnover_vs_peers_7d
      - last_day_vs_own_median_30d
    log_features: [unique_payers_per_day_7d, turnover_vs_peers_7d, last_day_vs_own_median_30d]
    snapshot_every_days: 7 # train on weekly snapshots, not every near-identical day
    n_estimators: 200
