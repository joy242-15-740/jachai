# Model settings. Not business rules (those are in rules.yaml). [assumption]
# Standard, conservative LightGBM settings; not tuned on the test set.

payment_model:
  lightgbm:
    objective: cross_entropy # accepts soft targets in [0, 1]
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    num_boost_round: 500
    early_stopping_rounds: 50 # on validation weak labels
  # Frozen on validation: the cut-off that maximises F1 against validation targets.
  threshold_metric: f1

shop_model:
  # 1) Expected daily turnover from what the shop IS (not what it does).
  turnover:
    inputs: [category, area_type, size_tier]
    loss: absolute_error # median-type loss: a few huge misuse shops cannot pull "expected" up
    max_iter: 200
    learning_rate: 0.1
  # 2) Odd behaviour among similar shops.
  isolation_forest:
    peer_group: [category, area_type]
    min_peer_shops: 30 # smaller groups fall back to the category alone
    features:
      - round_1000_share_30d
      - after_hours_share_30d
      - first_visit_share_30d
      - far_payer_share_30d
      - unique_payers_per_day_7d
      - turnover_vs_peers_7d
      - last_day_vs_own_median_30d
    log_features: [unique_payers_per_day_7d, turnover_vs_peers_7d, last_day_vs_own_median_30d]
    snapshot_every_days: 7 # train on weekly snapshots, not every near-identical day
    n_estimators: 200

network:
  window_days: 30 # graph built from the previous 30 days of QR payments
  snapshot_every_days: 7 # a shop-day uses the latest snapshot on or before it
  # Two shops are linked when the same payer paid both on the same day AND that
  # payer's QR total that day went past regulation.cash_out_limit_daily (share 1.0)
  # across at least link_min_shops_same_day shops: the brief's limit-bypass
  # definition. (Half the limit across 2 shops also linked honest big shoppers.)
  link_min_day_total_share: 1.0
  link_min_shops_same_day: 3
  min_shared_payers: 2 # distinct linking payers needed for an edge
  max_shops_per_payer: 25 # payers visiting more shops are skipped (they would link everything)

fusion:
  # Shop-day risk = weighted average of component ranks. Each component is first
  # turned into "share of TRAIN shop-days with a lower value" (0..1), so a z-score,
  # an anomaly score, a count and a 0/1 flag become comparable.
  # Weighting scheme: EQUAL weights (a plain average of ranks). A fixed, documented
  # rule [assumption], NOT tuned: validation has too few misuse shops to tune eight
  # weights without fitting noise. The ablation shows what each part adds.
  # rules_flags_30d layers the existing rules into the score (ML on top of rules),
  # added after validation showed rules alone rank shops very well on the normal
  # world (see reports/validation_evaluation.md and reports/circularity_note.md).
  payment_window_days: 7
  rules_window_days: 30
  weights:
    payment_top3_7d: 1.0 # mean of the shop's 3 riskiest payments, last 7 days
    payment_flag_share_7d: 1.0 # share of its payments above the payment threshold
    rules_flags_30d: 1.0 # payments the rules flagged, last 30 days
    turnover_z: 1.0 # busier than a shop like this should be
    peer_anomaly: 1.0 # unusual among similar shops
    linking_payers: 1.0 # payers linking it to others on same heavy days
    ring_flag: 1.0 # part of a small, tight ring
    distant_payer_share: 1.0 # payers living far away

ablation:
  # Payment-model feature groups, named by reason codes (configs/reason_codes.yaml),
  # so "amount" means the same thing in explanations and in the ablation.
  payment_feature_groups:
    amount: [ROUND_AMOUNT, LARGE_FOR_CATEGORY, JUST_UNDER_CAP]
    timing: [AFTER_HOURS]
    payer_day: [NEAR_LIMIT]
    money_in_then_out: [AFTER_INFLOW]
    who_and_where: [DISTANT_PAYER, NEW_PAYER]
    payer_history: [PAYER_HISTORY]
    shop_history: [SHOP_BUSY, SHOP_ROUND, SHOP_NIGHT, SHOP_STRANGERS, SHOP_PROFILE]
  # Fusion component groups.
  fusion_groups:
    payment: [payment_top3_7d, payment_flag_share_7d]
    rules: [rules_flags_30d]
    shop: [turnover_z, peer_anomaly]
    network: [linking_payers, ring_flag, distant_payer_share]
