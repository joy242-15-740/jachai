# Business rules. Labeling functions (weak labels) read their thresholds and vote
# weights from here; nothing is hard-coded in ml/jachai/labels/.
# All values are [assumption] unless tagged [brief]. Regulatory numbers (Tk 30,000
# limit, Tk 2,000 cap) come from configs/world.yaml `regulation`.

labeling_functions:
  # --- vote 1 (misuse) on QR payments -------------------------------------------
  lf_cash_desk: # round amount, stranger, at night or from far away
    weight: 1.0
    min_amount: 1000
    far_km: 20
  lf_remittance_drain: # most of a recent remittance paid to a distant shop
    weight: 1.0
    min_paid_share: 0.8
    min_distance_km: 50
  lf_turnover_burst: # stranger from far away paying many times the usual basket
    weight: 0.8
    min_amount_vs_median: 20
    min_distance_km: 30
  lf_limit_bypass: # payer over the daily limit today, across several shops [brief]
    weight: 1.0
    min_shops_today: 3 # 2 caught too many honest big shopping days (TV + groceries)
    round_unit: 500 # split pieces are round, honest receipts mostly are not
  lf_incentive_splitting: # repeated just-under-cap payments at one shop after 1 Oct [brief]
    weight: 1.0
    min_payments_here_today: 2

  # --- vote 0 (honest) on QR payments --------------------------------------------
  lf_honest_small_ticket: # ordinary basket, nothing odd about the payer's day
    weight: 0.5
    max_amount_vs_median: 3
  lf_honest_regular_customer: # known customer, lives nearby, non-round amount
    weight: 0.5
    max_distance_km: 10

  # --- vote 1 (misuse) on shop-days ----------------------------------------------
  lf_p2p_disguise: # many different people paying the owner's personal wallet
    weight: 1.0
    min_p2p_senders_7d: 15

aggregator:
  kind: weighted_vote # interface allows a learned label model to replace it
  threshold: 0.5 # weak label 1 when the weighted share of misuse votes >= this

# Baselines: what upay could do without Jachai. Used only for comparison.
baselines:
  rules_only:
    # A shop is flagged when this many of its payments get weak label 1, or when
    # a shop-day labeling function fires.
    min_flagged_payments: 3
  blanket_limit:
    # Every merchant, whatever its size or trade, may receive at most this much by
    # QR per day. Payments past the cap that day are blocked; a shop that ever
    # hits the cap is "flagged".
    daily_cap: 100000

# How the payment model's training target is built from the evidence we have.
# Soft target = weighted average of the available evidence; training weight = the
# sum of those weights. Rows with no evidence (all rules abstain, no usable case)
# are dropped. Cases are only used if closed before the split's cutoff, only for
# that split's shops, and only for payments made before the case closed.
training_target:
  mode: weak_and_cases # weak | weak_and_cases | cases (ablation compares all three)
  rule_weight: 1.0 # rules' weighted vote (weak_proba)
  case_weight: 3.0 # a closed investigation counts more than the rules

# Ring flag on the payer-shop network (see ml/jachai/models/network.py).
# A ring: a small community of nearby shops that share many of the same payers,
# which is how limit-bypass rings look [brief].
ring_flag:
  community_size: [3, 8]
  max_span_km: 10 # all ring shops within this distance of each other
  min_linking_payers: 2 # payers linking this shop to others in its ring

# Recommended next step shown on a case (the analyst still decides; nothing is
# automatic). Checked in this order; the first match wins.
recommendation:
  # Policy E threshold: estimated flagged (cash-out-like) taka in the last 30 days
  # above which a confirmed shop is worth an agent-contract offer. Same value as
  # configs/simulator.yaml convert_min_monthly_taka.
  convert_min_monthly_demand: 100000
  rules:
    - when: ring
      action: escalate
      en: "Possible limit-bypass ring: {linking_payers} payers link it to {community_size} nearby shops. A senior analyst should review the whole group."
      bn: "সম্ভাব্য সীমা-এড়ানো চক্র: {linking_payers} জন গ্রাহক একে কাছাকাছি {community_size}টি দোকানের সাথে যুক্ত করেছেন। পুরো দলটি একজন সিনিয়র বিশ্লেষকের দেখা উচিত।"
    - when: high_and_demand
      action: convert
      en: "Strong cash-out demand (about Tk {demand} of flagged payments in 30 days). If confirmed, offer an agent contract so customers get licensed cash-out."
      bn: "নগদ উত্তোলনের চাহিদা বেশি (৩০ দিনে প্রায় ৳{demand} চিহ্নিত পেমেন্ট)। নিশ্চিত হলে এজেন্ট চুক্তির প্রস্তাব দিন, যাতে গ্রাহকরা লাইসেন্সপ্রাপ্ত পথে নগদ পান।"
    - when: high
      action: educate
      en: "High priority, but cash-out demand is modest (about Tk {demand} flagged in 30 days). Talk to the owner and explain the QR rules first."
      bn: "উচ্চ অগ্রাধিকার, তবে নগদ চাহিদা মাঝারি (৩০ দিনে প্রায় ৳{demand} চিহ্নিত)। আগে মালিকের সাথে কথা বলে QR নিয়ম বুঝিয়ে দিন।"
    - when: review
      action: monitor
      en: "Some unusual signs. Monitor for two weeks before deciding."
      bn: "কিছু অস্বাভাবিক লক্ষণ আছে। সিদ্ধান্তের আগে দুই সপ্তাহ পর্যবেক্ষণ করুন।"
    - when: low
      action: clear
      en: "No strong evidence of misuse. No action needed."
      bn: "অপব্যবহারের জোরালো প্রমাণ নেই। কোনো পদক্ষেপের দরকার নেই।"
