# Thresholds used by feature engineering and checks. Not business actions:
# those live in rules.yaml. Every value is [assumption] unless tagged [brief].

features:
  round_units: [100, 500, 1000] # amount is a multiple of each -> is_round_<unit>
  near_limit_share: 0.8 # payer's QR total today >= 80% of regulation.cash_out_limit_daily
  just_under_cap_band: 200 # cap - 200 <= amount < cap  (cap = regulation.qr_incentive_cap)
  inflow_window_minutes: 60 # money paid soon after an add-money or remittance
  remittance_window_hours: 48 # remittance drain window
  category_median_lookback_days: 30 # basket reference: past days only
  short_window_days: 7 # payer and shop history windows (earlier days only)
  long_window_days: 30
  far_payer_km: 20 # payer lives at least this far from the shop

eval:
  warmup_days: 30 # first days lack history (long window); excluded from evaluation
  analyst_capacity_shops: 50 # shops an analyst team can review: precision@k for shops
  analyst_capacity_payments: 1000 # payments reviewed: precision@k for payments
  ablation_seeds: [42, 7, 2026] # worlds regenerated per seed for the validation ablation

split:
  # Split by shop AND by time: a shop is in exactly one group, and each group only
  # uses its own date range. Train ends after 1 Oct so incentive_splitting (which
  # only starts on 1 Oct) is in training; only `holdout_pattern` is unseen.
  shop_shares: { train: 0.6, validation: 0.2, test: 0.2 }
  train_end: 2026-10-05 # inclusive; training starts after eval.warmup_days
  validation_end: 2026-10-15 # inclusive; test runs from the next day to the window end
  holdout_pattern: turnover_burst # all its shops go to test; never trained or tuned on

bands:
  # Fused shop-day risk bands, frozen on VALIDATION shop-days as absolute cut-offs
  # (saved with the trained system) and never re-fitted on test.
  high_quantile: 0.98 # top 2% of validation shop-days -> "high"
  review_quantile: 0.92 # next 6% -> "review"; the rest -> "low"

leakage:
  # A single feature that predicts the true label this well on its own means the
  # synthetic world is too easy or a feature leaks the label. Measured as
  # max(AUC, 1 - AUC) so strongly negative predictors count too.
  max_single_feature_auc: 0.95
