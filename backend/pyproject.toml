[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jachai-backend"
version = "0.1.0"
description = "Jachai API: serves scores, reasons and case notes to the analyst dashboard"
requires-python = ">=3.12"
# FastAPI and Pydantic are added when the API is built, with rows in docs/third_party.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["app*"]
