[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jachai"
version = "0.1.0"
description = "Jachai ML: merchant-transaction integrity models for Bangla QR (synthetic data only)"
requires-python = ">=3.12"
# Each library is added when first used, together with a row in docs/third_party.md.
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "pyarrow>=25",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.9,<2",
    "lightgbm>=4.7,<5",
    "joblib>=1.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["jachai*"]
